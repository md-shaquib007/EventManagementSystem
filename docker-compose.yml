version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ceoms-postgres
    environment:
      POSTGRES_DB: ceoms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ceoms-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ceoms
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ceoms-docker-secret-key-change-in-production-must-be-at-least-256-bits-long!!
      CORS_ORIGINS: http://localhost:5173,http://localhost:80,http://localhost
      UPLOAD_DIR: /app/uploads
      FRONTEND_URL: http://localhost
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: ceoms-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
