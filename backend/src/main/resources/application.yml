spring:
  application:
    name: ceoms
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  cache:
    type: simple

server:
  port: ${serverPort:${SERVER_PORT:8080}}
  servlet:
    context-path: /api/v1

ceoms:
  jwt:
    secret: ${jwtSecret:${JWT_SECRET:ceoms-super-secret-key-change-in-production-must-be-at-least-256-bits-long!!}}
    access-token-expiration: ${jwtAccessExpiration:${JWT_ACCESS_EXPIRATION:900000}}
    refresh-token-expiration: ${jwtRefreshExpiration:${JWT_REFRESH_EXPIRATION:604800000}}
  cors:
    allowed-origins: ${corsOrigins:${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}}
  upload:
    dir: ${uploadDir:${UPLOAD_DIR:./uploads}}
  frontend:
    url: ${frontendUrl:${FRONTEND_URL:http://localhost:5173}}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.ceoms: INFO
    org.springframework.security: WARN
